name: Kopparpris

# Startas var 10:e minut av cron-job.org (via GitHubs API) med kalla = "cron".
# Manuellt: Actions -> Kopparpris -> Run workflow (kalla = "manuell").
on:
  workflow_dispatch:
    inputs:
      kalla:
        description: "Vem startade körningen (lämna som 'manuell')"
        required: false
        default: "manuell"

permissions:
  contents: read

concurrency:
  group: kopparpris
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera paket
        run: pip install -r requirements.txt

      - name: Uppdatera kopparpris i Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MESSAGE_ID: ${{ vars.MESSAGE_ID }}
          HISTORY_HOURS: ${{ vars.HISTORY_HOURS }}
          RUN_SOURCE: ${{ inputs.kalla }}
        run: python koppar_webhook.py
